name: Python checks

on:
  push:
    branches: [ "main" ]
    tags: [v*]
  pull_request:

env:
  FORCE_COLOR: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  prek-preflight:
    runs-on: ubuntu-latest
    name: "Prek preflight"
    outputs:
      skip-prek: ${{ steps.check-skip.outputs.skip-prek }}

    permissions:
      contents: read

    steps:
    - name: Check for skip label
      id: check-skip
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY_URL: "${{ format('{0}/{1}', github.server_url, github.repository) }}"
      run: |
        # check each commit message for a '[skip prek]' string
        set -euo pipefail
        COMMIT_DATA_PATH=${GITHUB_EVENT_PATH}
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          COMMIT_DATA_PATH="$(mktemp)"
          # for pull requests, GITHUB_REF_NAME is set to "<pr_number>/merge"
          gh pr view --json commits "${REPOSITORY_URL}/pull/${GITHUB_REF_NAME%/merge}" > "${COMMIT_DATA_PATH}"
        fi
        echo "::group::Commit data (JSON)"
        jq . "${COMMIT_DATA_PATH}"
        echo "::endgroup::"

        if jq --exit-status '.commits | any(.messageBody | contains("[skip prek]"))' "${COMMIT_DATA_PATH}" > /dev/null; then
          echo "::warning title=Skipping prek run::Found [skip prek] string in commit message, skipping validation with prek"
          echo 'skip-prek=true' >> "$GITHUB_OUTPUT"
        else
          echo 'skip-prek=false' >> "$GITHUB_OUTPUT"
        fi

  prek:
    runs-on: ubuntu-latest
    name: "Prek git-hook checks"
    needs: prek-preflight
    if: ${{ ! fromJSON(needs.prek-preflight.outputs.skip-prek) }}

    env:
      UV_FROZEN: true

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: | # zizmor: ignore[cache-poisoning] cache is disabled when publishing to prevent poisoning
          ${{ github.ref_type == 'tag' && 'false' || 'auto' }}
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: uv sync

    - name: Install prek
      uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
      with:
        install-only: true

    - name: Run prek git-hook checks against changed files
      run: bash .github/prek-run-changed.sh

  linting:
    runs-on: ubuntu-latest
    name: "Python linting"
    permissions:
      contents: read
    env:
      UV_FROZEN: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 🐍
      id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: "pyproject.toml"

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: | # zizmor: ignore[cache-poisoning] cache is disabled when publishing to prevent poisoning
          ${{ github.ref_type == 'tag' && 'false' || 'auto' }}
        cache-dependency-glob: "uv.lock"
        python-version: ${{ steps.python.outputs.python-path }}
        activate-environment: true

    - name: Check lock is up-to-date
      run: |
        uv lock --check

    - name: Install dependencies
      run: |
        uv sync

    - name: Check file formatting
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      with:
        args: "format --check"

    - name: Lint with ruff
      env:
        RUFF_OUTPUT_FORMAT: github
      run: |
        ruff check

    - name: Typecheck with pyright
      uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef # v3.0.2
      with:
        version: PATH

    - name: Check documentation
      run: |
        for file in changelog.d/*; do
          if [[ "$file" == changelog.d/towncrier_template.md ]]; then
            continue
          fi
          if [[ ! "$file" =~ /[0-9]+\.(feature|bugfix|doc|removal|misc)(\.md)?$ ]]; then
            echo -e "Not a valid towncrier fragment name: \e[1;33m{{.ITEM}}\e[0m"
            echo 'Towncrier fragments consist of the GitHub issue number, a dot, and a type (feature, bugfix, doc, removal, misc), optionally followed by .md.'
            exit 1
          fi
        done
        uv run towncrier build --draft
        cd docs || exit 1
        make spelling

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15-dev", "3.15t-dev"]

    name: Python tests (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write  # needed for the codecov actions to obtain a OIDC token
    env:
      UV_FROZEN: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }} 🐍
      id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        enable-cache: | # zizmor: ignore[cache-poisoning] cache is disabled when publishing to prevent poisoning
          ${{ github.ref_type == 'tag' && 'false' || 'auto' }}
        cache-dependency-glob: "uv.lock"
        python-version: ${{ steps.python.outputs.python-path }}

    - name: Install dependencies
      run: uv sync

    - name: Test with pytest
      run: |
        # codecov requires that the test results are shared in xunit1 / legacy format.
        uv run pytest -v --junitxml=junit.xml -o junit_family=legacy

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        use_oidc: true

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        report_type: test_results
        use_oidc: true

  test-summary:
    name: Test matrix status
    runs-on: ubuntu-latest
    needs:
      - prek-preflight
      - prek
      - linting
      - tests
    env:
      RESULTS_WITHOUT_PREK: ${{ format('["{0}", "{1}", "{2}"]', needs.prek-preflight.result, needs.linting.result, needs.tests.result) }}
    if: always()
    steps:
    - name: Decide whether the needed jobs succeeded or failed
      env:
        SUCCEEDED: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(fromJSON(env.RESULTS_WITHOUT_PREK), 'skipped') || (needs.prek-preflight.outputs.skip-prek == 'false' && needs.prek.result == 'skipped')) }}
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        echo '::group::Needs JSON object'
        echo "${NEEDS_JSON}" | jq .
        echo '::endgroup::'

        # shellcheck disable=SC2016
        FILTER='
          # any failure or cancelled results?
            (map_values(.|select(.result | test("^(failure|cancelled)$"))) | keys) as $unsuccessful
          # any skipped results?
          | (map_values(.|select(.result == "skipped")) | keys) as $skipped
          # are we skipping prek?
          | .["prek-preflight"].outputs["skip-prek"] == "false" as $expect_prek
          | any($unsuccessful[], $skipped[] | select((. != "prek") or $expect_prek))
        '

        if echo "$NEEDS_JSON" | jq --exit-status "$FILTER" > /dev/null; then
            echo "One or more jobs failed, or were skipped or cancelled"
            exit 1
        fi
        echo Success

  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_FROZEN: true
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs:
      - test-summary

    outputs:
      version: ${{ steps.note.outputs.version }}
      prerelease: ${{ steps.note.outputs.prerelease }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 🐍
      id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: "pyproject.toml"

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: false
        cache-dependency-glob: "uv.lock"
        python-version: ${{ steps.python.outputs.python-path }}

    - name: Build the Python 🐍 binary wheel and source tarball 📦
      id: build-dist
      run: |
        uv build
        rm -f dist/.gitignore  # get-releasenotes can't handle non-dist files here
        echo "version=$(uvx hatch version)" >> "$GITHUB_OUTPUT"

    - name: Check build
      run: uvx twine check --strict dist/*

    - name: Prepare Release Note
      id: note
      uses: aio-libs/get-releasenote@b0fcc7f3e5f5cc7c8b01e2f75516b1732f6bd8b2 # v1.4.5
      with:
        changes_file: CHANGELOG.md
        output_file: release_notes.md
        version: ${{ steps.build-dist.outputs.version }}
        start_line: '<!-- changes go below this line -->'
        head_line: '## \[{version}\] - {date}'
        name: Aiolimiter
        dist_dir: dist

    - name: Store the Python 🐍 distribution 📦
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: python-package-distributions
        path: |
          dist/
          release_notes.md

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs:
      - build
    environment:
      name: pypi
      url: https://pypi.org/p/aiolimiter
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
      contents: write  # required for creating GH releases

    steps:
    - name: Download Python 🐍 distribution 📦
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: python-package-distributions

    - name: Publish Python 🐍 distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

    - name: GitHub release
      env:
        RELEASE_TITLE: Aiolimiter ${{ needs.build.outputs.version }}
        PRERELEASE_SWITCH: ${{ case(fromJSON(needs.build.outputs.prerelease), '--prerelease', '') }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: gh release create --title "${RELEASE_TITLE}" --notes-file release_notes.md "${PRERELEASE_SWITCH}" "${GITHUB_REF_NAME}" dist/*
